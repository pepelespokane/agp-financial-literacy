<!DOCTYPE html>
<html lang="en" class="theme-spokane-colleges">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>WEC Trivia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="brand">Spokane Colleges</div>
  <div class="event">WEC Trivia</div>
</header>

<main class="wrap">
  <div class="card">
    <h1>Welcome</h1>
    <p class="sub">Pick how you're joining this session:</p>
    <a href="join.html" id="player-link" class="btn" style="text-decoration:none; text-align:center;">I'm a Player</a>
    <a href="host.html" id="host-link" class="btn btn-secondary" style="text-decoration:none; text-align:center;">Host View</a>
    <a href="display.html" id="display-link" class="btn btn-secondary" style="text-decoration:none; text-align:center;">Display View</a>
  </div>
</main>

<script>
  // Preserve ?game= param when navigating from landing page.
  (function () {
    const qs = window.location.search;
    if (!qs) return;
    ['player-link', 'host-link', 'display-link'].forEach(id => {
      const a = document.getElementById(id);
      if (a) a.href = a.getAttribute('href') + qs;
    });
  })();
</script>

<div class="footer">
  Spokane Colleges &nbsp;|&nbsp; Workforce Education Council
</div>
</body>
</html>
